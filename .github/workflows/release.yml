# release.yml by Daniele Lolli (UncleDan) feat. Claude AI - Release 1.1.0 - 2026-10-24 21-02-56
# Release firmata: si avvia con un tag vX.Y.Z (deve coincidere con versionName).
# Pubblica APK + SHA256 su GitHub Releases; l'AAB resta come artifact.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Versione da build.gradle.kts
        run: |
          VN=$(grep -E '^\s*versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "VN=$VN" >> "$GITHUB_ENV"
          echo "Versione: $VN"

      - name: Verifica tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VN" ]; then
            echo "::error::Il tag $GITHUB_REF_NAME non corrisponde a versionName v$VN"
            exit 1
          fi

      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 mancante (vedi docs/FIRMA.md)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PDM_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test e build
        env:
          PDM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PDM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PDM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease bundleRelease

      - name: Prepara file
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/PD-Measure-$VN.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/PD-Measure-$VN.aab"
          (cd dist && sha256sum "PD-Measure-$VN.apk" > "PD-Measure-$VN.apk.sha256")

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PD-Measure-${{ env.VN }}
          path: dist/*

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: PD Measure ${{ env.VN }}
          generate_release_notes: true
          files: |
            dist/PD-Measure-${{ env.VN }}.apk
            dist/PD-Measure-${{ env.VN }}.apk.sha256
