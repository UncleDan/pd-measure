# play-prepare.yml by Daniele Lolli (UncleDan) feat. Claude AI - Release 1.0.0 - 2026-10-24 14-42-28
# Prepara il pacchetto per Google Play: AAB firmato + note di versione + icona 512.
# Avvio manuale; il caricamento su Play Console resta manuale (vedi docs/PUBBLICAZIONE_GOOGLE_PLAY.md).
name: Play prepare

on:
  workflow_dispatch:
    inputs:
      note_it:
        description: 'Note di versione (it-IT)'
        required: false
        default: 'Miglioramenti e correzioni.'
      note_en:
        description: 'Release notes (en-US)'
        required: false
        default: 'Improvements and fixes.'

jobs:
  play:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Versione
        run: |
          VN=$(grep -E '^\s*versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          VC=$(grep -E '^\s*versionCode\s*=' app/build.gradle.kts | head -1 | sed -E 's/[^0-9]//g')
          echo "VN=$VN" >> "$GITHUB_ENV"
          echo "VC=$VC" >> "$GITHUB_ENV"

      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 mancante (vedi docs/FIRMA.md)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PDM_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build AAB
        env:
          PDM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PDM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PDM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest bundleRelease

      - name: Pacchetto Play
        env:
          NOTE_IT: ${{ inputs.note_it }}
          NOTE_EN: ${{ inputs.note_en }}
        run: |
          OUT="play/PD-Measure-$VN"
          mkdir -p "$OUT/whatsnew"
          cp app/build/outputs/bundle/release/app-release.aab "$OUT/PD-Measure-$VN-$VC.aab"
          printf '%s\n' "$NOTE_IT" > "$OUT/whatsnew/whatsnew-it-IT"
          printf '%s\n' "$NOTE_EN" > "$OUT/whatsnew/whatsnew-en-US"
          cp docs/play/icon-512.png "$OUT/"
          printf 'versionName=%s\nversionCode=%s\ncommit=%s\n' "$VN" "$VC" "$GITHUB_SHA" > "$OUT/build-info.txt"

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PD-Measure-${{ env.VN }}-play
          path: play/
